# LiteLLM router config (AA-16 / ADR v1.1.0 §3) — model groups "extractor"
# and "commentary" (AA-25, worker/commentary.py).
#
# `extractor` and `commentary` stay Groq-only, so production routing is
# unchanged. ADR v1.2.0 §3 (AA-60) adds a separate `<use>-local` group per use
# that reaches only the Box's vLLM: the worker, not the router, decides which
# group to call (worker/model_target.py), so a `-local` group never retries,
# never falls back and carries no rpm/tpm. Its served-model name is
# llm/local_model.toml's, kept in step by tests/unit/test_local_stack_config.py.
#
# RPM/TPM caps are set below Groq's published free-tier limits for this
# model (console.groq.com/settings/limits) so a runaway extraction loop can
# never cross into a paid tier — CLAUDE.md hard rule #6 / Assumption A16.
# Re-check those console limits before raising these numbers; they are not
# verified against a live Groq account from this repo. `commentary` shares
# the same underlying Groq model/account as `extractor`, so its caps are
# sized to leave headroom under the account-wide limit rather than being an
# independent budget — 20 (extractor) + 5 (commentary) rpm and 5000 + 1000
# tpm must both stay below whatever the console reports today.
#
# Model: Groq retired llama-3.3-70b-versatile for free and developer accounts
# on 2026-08-16 (404 model_not_found); gpt-oss-120b is its documented
# replacement. Its free-tier limits, read from the console by the owner on
# 2026-10-15: 30 RPM, 1K RPD, 8K TPM, 200K TPD. The caps below total 25 rpm
# and 6000 tpm, under both per-minute limits. Daily limits are not capped
# here; on the free tier Groq answers 429 past them rather than billing.
model_list:
  - model_name: extractor
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY
      rpm: 20
      tpm: 5000
      max_retries: 0 # a retry storm, not a single slow call, is the real cap risk
  - model_name: commentary
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY
      rpm: 5
      tpm: 1000
      max_retries: 0
  - model_name: extractor-local
    litellm_params:
      model: hosted_vllm/qwen3-4b-2507-fp8-unpinned
      api_base: http://vllm:8000/v1
      num_retries: 0 # the worker's call policy (AA-62) owns retries
      max_retries: 0 # and the SDK must not multiply them
  - model_name: commentary-local
    litellm_params:
      model: hosted_vllm/qwen3-4b-2507-fp8-unpinned
      api_base: http://vllm:8000/v1
      num_retries: 0
      max_retries: 0

litellm_settings:
  drop_params: true
  set_verbose: false
  # LiteLLM's built-in Prometheus integration (docs.litellm.ai/docs/proxy/prometheus)
  # — exposes /metrics (litellm_requests_total, latency histograms, spend) for
  # Grafana Alloy to scrape (AA-27, worker/observability/alloy-config.alloy).
  # Unverified against a live proxy instance in this sandbox.
  callbacks: ["prometheus"]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # Off: a background probe of a group containing Groq is a real completion
  # call that spends quota.
  background_health_checks: false
