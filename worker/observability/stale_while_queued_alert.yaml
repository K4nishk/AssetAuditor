# Stale-while-queued alert (AA-34) — Grafana unified-alerting provisioning
# file (apiVersion 1: https://grafana.com/docs/grafana/latest/alerting/set-up/provision-alerting-resources/file-provisioning/).
#
# Definition only. AA-27 ("Metrics wiring — worker /metrics + Alloy scrape,
# API batched remote_write, Grafana dashboards + 3 alerts") owns actually
# mounting this into a running Grafana Cloud instance (provisioning path,
# contact points, notification policy) once GRAFANA_CLOUD_* secrets exist —
# see .env.example and docs/vault/30-architecture/Observability.md's
# "worker heartbeat stale >2h while jobs queued" alert entry.
#
# Both gauges are emitted by worker/metrics.py from worker/main.py's
# heartbeat_loop/job_poll_loop and scraped off the worker's /metrics
# endpoint. `2h` mirrors app/domain/worker_status.py's ALERT_STALE_THRESHOLD —
# keep the two in sync if either changes.
#
# Unverified: no Grafana Cloud account/credentials exist in this sandbox;
# this file has never been applied to a real Grafana instance.

apiVersion: 1

groups:
  - orgId: 1
    name: worker-availability
    folder: AssetAuditor
    interval: 5m
    rules:
      - uid: worker-stale-while-queued
        title: Worker heartbeat stale while jobs are queued
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: grafanacloud-prom
            model:
              expr: time() - worker_heartbeat_timestamp
              refId: A
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: grafanacloud-prom
            model:
              expr: etl_jobs_queued
              refId: B
          - refId: C
            datasourceUid: "__expr__"
            model:
              type: math
              # 7200s == app/domain/worker_status.py's ALERT_STALE_THRESHOLD (2h).
              expression: "$A > 7200 && $B > 0"
              refId: C
        for: 10m
        labels:
          severity: warning
          area: worker-availability
        annotations:
          summary: >-
            Jobs are queued but the worker hasn't sent a heartbeat in over 2h —
            check whether the home-lab box is powered on and reachable
            (worker/bring-up.md's heartbeat check).
