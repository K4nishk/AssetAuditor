[project]
name = "assetauditor"
version = "0.1.0"
description = "Finances + Portfolio auditor (Canada-first) — provenance-tracked ETL, contribution rooms, diversification dashboards"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi==0.141.1",
    "openai>=3.6.0",
    "pdfplumber>=0.11.10",
    "prometheus-client>=0.26.0",
    "pyarrow>=25.0.1",
    "pydantic==2.13.4",
    "pyjwt[crypto]>=2.13.0",
    "python-multipart>=0.0.32",
    "uvicorn==0.52.1",
    "yfinance>=1.7.0",
]

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "httpx==0.28.1",
    "pytest-asyncio>=1.4.0",
    "mypy>=2.3.1",
    "ruff>=0.16.5",
    "pip-audit>=2.10.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# ops/ predates this template and is planning/orchestration tooling, not app code;
# AA-3 owns repo-wide CI lint policy.
extend-exclude = ["ops"]

[tool.ruff.lint]
# S608 = flake8-bandit "possible SQL injection via string-based query construction":
# catches f-strings, %-formatting, .format(), and concatenation used to build SQL.
# This is CLAUDE.md's hard rule #3 ("raw SQL, parameterized only") as a CI gate
# (AA-3) — every other bandit check is out of scope for this issue.
select = ["E", "F", "I", "UP", "B", "S608"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's `Depends(...)`/`Query(...)`/etc. as argument defaults is the
# framework's own documented pattern (evaluated once per request by FastAPI,
# not at def-time) — not the mutable-default-argument bug B008 flags.
extend-immutable-calls = ["fastapi.Depends", "fastapi.params.Depends"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

# Pillow (transitive via pdfplumber) lazily imports numpy inside a few
# PIL.Image function bodies; numpy's installed stub uses PEP 695 `type` alias
# syntax that requires Python 3.12+ to parse, incompatible with this
# project's `python_version = "3.11"` target (matches worker/Dockerfile's
# python:3.11-slim) — mypy hard-crashes parsing the stub rather than
# reporting a normal type error. Skip following into Pillow entirely; we
# never need its inferred types.
[[tool.mypy.overrides]]
module = ["PIL", "PIL.*"]
follow_imports = "skip"

# `openai`'s embeddings helpers do a `TYPE_CHECKING`-guarded `import numpy`
# (worker/extract/llm_tier.py, AA-16, only uses openai's chat-completions
# surface, never embeddings) — mypy still resolves that import to build
# openai's own type info and hits numpy's installed stub using the same
# PEP 695 `type` alias syntax PIL hit above. Skipping `numpy` itself doesn't
# help (mypy parses an imported module's stub to learn its interface before
# per-module `follow_imports` suppresses errors in it); skip the openai
# submodules that reach numpy instead, same as PIL is skipped wholesale above.
[[tool.mypy.overrides]]
module = ["openai._extras", "openai._extras.*", "openai.lib._parsing._embeddings"]
follow_imports = "skip"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "llm_eval: golden-set eval against a live LiteLLM endpoint (AA-16) — skipped unless LITELLM_BASE_URL is set; runs in .github/workflows/llm-evals.yml",
]
